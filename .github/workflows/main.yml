### Perbaikan Utama:
1. **Desain Overlay Persis Seperti Gambar**:
   - Dibuat menjadi **satu bulatan terpadu** di pojok kanan atas.
   - Bagian atas menampilkan **angka persentase baterai** (contoh: `83`).
   - Bagian tengah menampilkan **ikon sinyal Wi-Fi**.
   - Bagian bawah menampilkan **4 titik indikator sinyal GSM**.
2. **Penyesuaian Waktu ke GMT+7 (WIB / Jakarta)**:
   - Menggunakan konfigurasi `TZ='Asia/Jakarta'` saat pembuatan nama file artifact dan pencatatan tanggal/jam kompilasi.
3. **Perbaikan Otomatisasi Update `README.md`**:
   - Menambahkan konfigurasi `permissions: contents: write` pada GitHub Actions agar token memiliki hak akses penuh untuk menyimpan (*commit*) dan mendorong (*push*) pembaruan file `README.md` di folder utama repository.

