          # 12. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/MainActivity.kt
          package com.example.iosstatusbar

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var tvStatus: TextView
              private lateinit var seekX: SeekBar
              private lateinit var seekY: SeekBar
              private lateinit var seekAlpha: SeekBar
              private lateinit var tvLabelX: TextView
              private lateinit var tvLabelY: TextView
              private lateinit var tvLabelAlpha: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvStatus = findViewById(R.id.tvStatus)
                  seekX = findViewById(R.id.seekX)
                  seekY = findViewById(R.id.seekY)
                  seekAlpha = findViewById(R.id.seekAlpha)
                  tvLabelX = findViewById(R.id.tvLabelX)
                  tvLabelY = findViewById(R.id.tvLabelY)
                  tvLabelAlpha = findViewById(R.id.tvLabelAlpha)

                  val btnStart = findViewById<Button>(R.id.btnStart)
                  val btnStop = findViewById<Button>(R.id.btnStop)
                  val btnApply = findViewById<Button>(R.id.btnApply)

                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  val posX = prefs.getInt("pos_x", 15)
                  val posY = prefs.getInt("pos_y", 0)
                  val alphaVal = prefs.getInt("alpha", 100)

                  seekX.progress = posX
                  seekY.progress = posY
                  seekAlpha.progress = alphaVal

                  updateLabels(posX, posY, alphaVal)

                  seekX.setOnSeekBarChangeListener(createSeekListener())
                  seekY.setOnSeekBarChangeListener(createSeekListener())
                  seekAlpha.setOnSeekBarChangeListener(createSeekListener())

                  btnStart.setOnClickListener { checkOverlayAndStart() }
                  btnStop.setOnClickListener { stopStatusService() }
                  btnApply.setOnClickListener { saveAndApplyConfig() }
              }

              private fun createSeekListener() = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                      updateLabels(seekX.progress, seekY.progress, seekAlpha.progress)
                  }
                  override fun onStartTrackingTouch(sb: SeekBar?) {}
                  override fun onStopTrackingTouch(sb: SeekBar?) {}
              }

              private fun updateLabels(x: Int, y: Int, alpha: Int) {
                  tvLabelX.text = "Posisi X Offset: $x dp"
                  tvLabelY.text = "Posisi Y Offset: $y dp"
                  tvLabelAlpha.text = "Opasitas / Transparansi: $alpha%"
              }

              private fun checkOverlayAndStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, 1234)
                  } else {
                      startStatusService()
                  }
              }

              private fun startStatusService() {
                  saveConfig()
                  val intent = Intent(this, StatusBarOverlayService::class.java)
                  startService(intent)
                  tvStatus.text = "Status: Aktif"
                  Toast.makeText(this, "Status bar iOS Duo diaktifkan!", Toast.LENGTH_SHORT).show()
              }

              private fun stopStatusService() {
                  val intent = Intent(this, StatusBarOverlayService::class.java)
                  stopService(intent)
                  tvStatus.text = "Status: Nonaktif"
                  Toast.makeText(this, "Status bar iOS Duo dihentikan!", Toast.LENGTH_SHORT).show()
              }

              private fun saveConfig() {
                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  prefs.edit()
                      .putInt("pos_x", seekX.progress)
                      .putInt("pos_y", seekY.progress)
                      .putInt("alpha", seekAlpha.progress)
                      .apply()
              }

              private fun saveAndApplyConfig() {
                  saveConfig()
                  val intent = Intent(this, StatusBarOverlayService::class.java).apply {
                      action = StatusBarOverlayService.ACTION_UPDATE
                  }
                  startService(intent)
                  Toast.makeText(this, "Config berhasil disimpan dan diterapkan!", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 13. StatusBarOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/StatusBarOverlayService.kt
          package com.example.iosstatusbar

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView

          class StatusBarOverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: View
              private lateinit var monitor: SystemStatusMonitor
              private var params: WindowManager.LayoutParams? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  overlayView = LayoutInflater.from(this).inflate(R.layout.layout_stacked_status, null)

                  val layoutParamsType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutParamsType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                  }

                  applyPreferences()
                  windowManager.addView(overlayView, params)

                  monitor = SystemStatusMonitor(this) { pct, _ ->
                      val tvBatteryPct = overlayView.findViewById<TextView>(R.id.tvBatteryPct)
                      tvBatteryPct.text = "$pct"
                  }
                  monitor.start()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_UPDATE) {
                      applyPreferences()
                      params?.let { windowManager.updateViewLayout(overlayView, it) }
                  }
                  return START_STICKY
              }

              private fun applyPreferences() {
                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  val posX = prefs.getInt("pos_x", 15)
                  val posY = prefs.getInt("pos_y", 0)
                  val alphaVal = prefs.getInt("alpha", 100)

                  params?.x = posX
                  params?.y = posY
                  overlayView.alpha = alphaVal / 100f
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::overlayView.isInitialized) {
                      try { windowManager.removeView(overlayView) } catch (_: Exception) {}
                  }
                  if (::monitor.isInitialized) monitor.stop()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  const val ACTION_UPDATE = "com.example.iosstatusbar.UPDATE_CONFIG"
              }
          }
          EOF

          # 14. SystemStatusMonitor.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/SystemStatusMonitor.kt
          package com.example.iosstatusbar

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager

          class SystemStatusMonitor(
              private val context: Context,
              private val onStatusChanged: (batteryPct: Int, isCharging: Boolean) -> Unit
          ) {
              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(ctx: Context?, intent: Intent?) {
                      intent?.let {
                          val level = it.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                          val scale = it.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                          val status = it.getIntExtra(BatteryManager.EXTRA_STATUS, -1)

                          val pct = if (level != -1 && scale != -1) (level * 100 / scale.toFloat()).toInt() else 83
                          val charging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                         status == BatteryManager.BATTERY_STATUS_FULL

                          onStatusChanged(pct, charging)
                      }
                  }
              }

              fun start() {
                  val filter = IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  context.registerReceiver(batteryReceiver, filter)
              }

              fun stop() {
                  try {
                      context.unregisterReceiver(batteryReceiver)
                  } catch (_: Exception) {}
              }
          }
          EOF

      - name: Generate Gradle Wrapper 8.5
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug

      - name: Get Date and Time String (Asia/Jakarta GMT+7)
        id: timestamp
        run: |
          export TZ='Asia/Jakarta'
          echo "TIMESTAMP=$(date +%Y-%m-%d_%H-%M)" >> $GITHUB_ENV
          echo "BUILD_TIME_WIB=$(date +'%Y-%m-%d %H:%M:%S WIB')" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Duo-StatusBar-${{ env.TIMESTAMP }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Update Cumulative README.md & Changelog
        if: success()
        env:
          FILE_VER: "iOS-Duo-StatusBar-${{ env.TIMESTAMP }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BUILD_TIME_WIB: "${{ env.BUILD_TIME_WIB }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import os

          file_ver = os.environ['FILE_VER']
          run_url = os.environ['RUN_URL']
          build_time = os.environ['BUILD_TIME_WIB']
          commit_msg = os.popen('git log -1 --pretty=format:\"%s\"').read().strip().replace('|', '-')

          new_row = f'| **[{file_ver}]({run_url})** | `{build_time}` | {commit_msg} | ✅ Berhasil |'

          readme_path = 'README.md'
          base_readme = f'''# iOS Duo Status Bar for Android 📱

          Aplikasi Android untuk menampilkan modul status bar gaya **iOS Duo** dalam bentuk bulatan terpadu berisi angka baterai, ikon Wi-Fi, dan indikator sinyal GSM.

          ---

          ## 🌟 Fitur Utama
          - **Integrated Circular Status Badge**: Bulatan terpadu berisi persentase baterai di atas, ikon Wi-Fi di tengah, serta titik sinyal GSM di bawah.
          - **Waktu GMT+7 (WIB)**: Penamaan artifact dan log kompilasi disesuaikan dengan zona waktu Jakarta, Indonesia.
          - **Custom APK Launcher Icon**: Ikon aplikasi disesuaikan dengan tampilan visual modul overlay.
          - **Kontrol Fast Switch**: Tombol Start, Stop, dan pengatur posisi offset live.

          ---

          ## 📦 Unduh APK & Artifacts Terbaru

          👉 **[Klik Di Sini Untuk Halaman Download / Artifacts Run Terbaru]({run_url})**

          ---

          ## 📋 Changelog (Catatan Perubahan Setiap Versi)

          | Versi File / Artifact | Tanggal & Jam Build (WIB) | Catatan Perubahan (Commit) | Status |
          | :--- | :--- | :--- | :--- |
          {new_row}

          ---

          ## 🚀 Cara Instalasi & Penggunaan

          1. Masuk ke tab **Actions** atau klik link tautan download di atas.
          2. Unduh file artifact zip (**{file_ver}**).
          3. Ekstrak file \`.zip\` dan instal \`app-debug.apk\`.
          4. Buka aplikasi, jalankan tombol **START**, dan atur posisi offset via slider **Config**.
          '''

          if not os.path.exists(readme_path):
              with open(readme_path, 'w') as f:
                  f.write(base_readme)
          else:
              with open(readme_path, 'r') as f:
                  content = f.read()
              
              table_header = '| :--- | :--- | :--- | :--- |'
              if table_header in content:
                  parts = content.split(table_header)
                  updated_content = parts[0] + table_header + '\n' + new_row + parts[1]
                  with open(readme_path, 'w') as f:
                      f.write(updated_content)
              else:
                  with open(readme_path, 'w') as f:
                      f.write(base_readme)
          "

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README and cumulative changelog for ${FILE_VER} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
