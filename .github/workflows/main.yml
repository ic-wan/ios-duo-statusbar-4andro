name: Build Android APK

on:
  push:
    branches: [ "main", "master", "feature/*", "dev" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Source Code
        run: |
          mkdir -p app/src/main/java/com/example/iosstatusbar
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iOS Duo Status Bar"
          include ':app'
          EOF

          # 2. build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.iosstatusbar'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.iosstatusbar"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. Launcher Icons
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#121212" />
              <corners android:radius="22dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1F1F1F"
                  android:pathData="M54,20m-28,0a28,28 0 1,0 56,0a28,28 0 1,0 -56,0"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,42c6,0 11.4,2.3 15.5,6.1l-3,3C62.8,47.6 58.6,45.8 54,45.8c-4.6,0 -8.8,1.8 -12.5,5.3l-3,-3C42.6,44.3 48,42 54,42z M54,58c1.5,0 2.8,1.3 2.8,2.8c0,1.5 -1.3,2.8 -2.8,2.8c-1.5,0 -2.8,-1.3 -2.8,-2.8c0,-1.5 1.3,-2.8 2.8,-2.8z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M42,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M50,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M58,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M66,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_bg" />
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          EOF

          # 6. Adaptive Custom View (CircularStatusView.kt)
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/CircularStatusView.kt
          package com.example.iosstatusbar

          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View

          class CircularStatusView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
              defStyleAttr: Int = 0
          ) : View(context, attrs, defStyleAttr) {

              var batteryPct: Int = 83
                  set(value) {
                      field = value.coerceIn(0, 100)
                      invalidate()
                  }

              var isWifiConnected: Boolean = true
                  set(value) {
                      field = value
                      invalidate()
                  }

              var wifiSignalLevel: Int = 3 // 0..4
                  set(value) {
                      field = value.coerceIn(0, 4)
                      invalidate()
                  }

              var gsmSignalLevel: Int = 4 // 0..4
                  set(value) {
                      field = value.coerceIn(0, 4)
                      invalidate()
                  }

              // Paint untuk Penegas Kontras Latar Belakang (Adaptive Dark Halo)
              private val shadowStrokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CC000000")
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }

              private val mainStrokePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }

              private val mainFillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.FILL
              }

              private val shadowFillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CC000000")
                  style = Paint.Style.FILL
              }

              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
              }

              private val textShadowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CC000000")
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  style = Paint.Style.STROKE
              }

              private val rectF = RectF()

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  val w = width.toFloat()
                  val h = height.toFloat()
                  val cx = w / 2f
                  val cy = h / 2f
                  val radius = (Math.min(w, h) / 2f) * 0.78f

                  if (radius <= 0) return

                  val strokeW = radius * 0.14f
                  shadowStrokePaint.strokeWidth = strokeW * 1.6f
                  mainStrokePaint.strokeWidth = strokeW

                  // 1. Teks Baterai "83" di Atas Tengah
                  val fontPx = radius * 0.48f
                  textPaint.textSize = fontPx
                  textShadowPaint.textSize = fontPx
                  textShadowPaint.strokeWidth = strokeW * 0.8f

                  val batteryText = "$batteryPct"
                  val textY = cy - radius * 0.85f

                  canvas.drawText(batteryText, cx, textY, textShadowPaint)
                  canvas.drawText(batteryText, cx, textY, textPaint)

                  // 2. Busur Lengkung Sisi Kiri & Kanan (Bracket Arcs Baterai)
                  val arcInset = strokeW * 0.8f
                  rectF.set(cx - radius + arcInset, cy - radius + radius * 0.25f, cx + radius - arcInset, cy + radius - radius * 0.15f)

                  val sweepAngle = 80f * (batteryPct / 100f)

                  // Lapisan Kontras Penegas Latar Belakang
                  canvas.drawArc(rectF, 135f, 90f, false, shadowStrokePaint)
                  canvas.drawArc(rectF, -45f, 90f, false, shadowStrokePaint)

                  // Lapisan Utama Busur
                  canvas.drawArc(rectF, 135f, sweepAngle, false, mainStrokePaint)
                  canvas.drawArc(rectF, -45f, sweepAngle, false, mainStrokePaint)

                  // 3. Ikon Wi-Fi di Tengah
                  val wifiCy = cy + radius * 0.1f
                  val wifiStrokeW = strokeW * 0.85f
                  val wifiMainPaint = Paint(mainStrokePaint).apply { strokeWidth = wifiStrokeW }
                  val wifiShadowPaint = Paint(shadowStrokePaint).apply { strokeWidth = wifiStrokeW * 1.6f }

                  if (isWifiConnected) {
                      for (i in 1..3) {
                          val r = radius * (0.12f + i * 0.12f)
                          rectF.set(cx - r, wifiCy - r, cx + r, wifiCy + r)

                          if (i <= wifiSignalLevel) {
                              canvas.drawArc(rectF, 225f, 90f, false, wifiShadowPaint)
                              canvas.drawArc(rectF, 225f, 90f, false, wifiMainPaint)
                          } else {
                              val dimPaint = Paint(mainStrokePaint).apply {
                                  color = Color.parseColor("#55FFFFFF")
                                  strokeWidth = wifiStrokeW
                              }
                              canvas.drawArc(rectF, 225f, 90f, false, dimPaint)
                          }
                      }
                      // Titik Pusat Wi-Fi
                      val dotR = radius * 0.055f
                      val dotY = wifiCy + radius * 0.08f
                      canvas.drawCircle(cx, dotY, dotR * 1.5f, shadowFillPaint)
                      canvas.drawCircle(cx, dotY, dotR, mainFillPaint)
                  }

                  // 4. 4 Titik Sinyal GSM Melengkung di Bawah
                  val dotRadius = radius * 0.065f
                  val dotArcR = radius * 0.95f
                  val angles = floatArrayOf(60f, 80f, 100f, 120f)

                  for (i in 0..3) {
                      val angleRad = Math.toRadians(angles[i].toDouble())
                      val dotX = cx + (dotArcR * Math.cos(angleRad)).toFloat()
                      val dotY = cy + (dotArcR * Math.sin(angleRad)).toFloat()

                      if (i < gsmSignalLevel) {
                          canvas.drawCircle(dotX, dotY, dotRadius * 1.5f, shadowFillPaint)
                          canvas.drawCircle(dotX, dotY, dotRadius, mainFillPaint)
                      } else {
                          val dimDotPaint = Paint(mainFillPaint).apply { color = Color.parseColor("#55FFFFFF") }
                          canvas.drawCircle(dotX, dotY, dotRadius, dimDotPaint)
                      }
                  }
              }
          }
          EOF

          # 7. Layout Overlay Status Bar (layout_stacked_status.xml)
          cat << 'EOF' > app/src/main/res/layout/layout_stacked_status.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <com.example.iosstatusbar.CircularStatusView
                  android:id="@+id/circularStatusView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </FrameLayout>
          EOF

