name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Source Code
        run: |
          mkdir -p app/src/main/java/com/example/iosstatusbar
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iOS Duo Status Bar"
          include ':app'
          EOF

          # 2. build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.iosstatusbar'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.iosstatusbar"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. Background Lingkaran/Oval (bg_overlay_circle.xml)
          cat << 'EOF' > app/src/main/res/drawable/bg_overlay_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#99000000" />
              <stroke android:width="1dp" android:color="#44FFFFFF" />
          </shape>
          EOF

          # 6. Vector Icon Wi-Fi (ic_wifi.xml)
          cat << 'EOF' > app/src/main/res/drawable/ic_wifi.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="16dp"
              android:height="16dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,3C7.31,3 3.07,4.9 0,8l2.83,2.83C5.14,8.5 8.41,7 12,7c3.59,0 6.86,1.5 9.17,3.83L24,8C20.93,4.9 16.69,3 12,3z M12,11c-2.39,0 -4.57,0.97 -6.17,2.54l2.83,2.83C9.74,15.42 10.82,15 12,15c1.18,0 2.26,0.42 3.34,1.37l2.83,-2.83C16.57,11.97 14.39,11 12,11z M12,18c-0.83,0 -1.5,0.67 -1.5,1.5S11.17,21 12,21s1.5,-0.67 1.5,-1.5S12.83,18 12,18z"/>
          </vector>
          EOF

          # 7. Vector Icon Titik Sinyal GSM (ic_gsm_dots.xml)
          cat << 'EOF' > app/src/main/res/drawable/ic_gsm_dots.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="16dp"
              android:height="6dp"
              android:viewportWidth="24"
              android:viewportHeight="8">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M3,4m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M9,4m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M15,4m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M21,4m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
          </vector>
          EOF

          # 8. App Launcher Icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#121212" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
