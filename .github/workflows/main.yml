name: Build Android APK

on:
  push:
    branches: [ "main", "master", "feature/*", "dev" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Source Code
        run: |
          mkdir -p app/src/main/java/com/example/iosstatusbar
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iOS Duo Status Bar"
          include ':app'
          EOF

          # 2. build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.iosstatusbar'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.iosstatusbar"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. Background Bulatan Lingkaran (bg_status_circle.xml)
          cat << 'EOF' > app/src/main/res/drawable/bg_status_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#0D0D0D" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
          </shape>
          EOF

          # 6. Vector Icon Wi-Fi (ic_wifi_small.xml)
          cat << 'EOF' > app/src/main/res/drawable/ic_wifi_small.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="14dp"
              android:height="10dp"
              android:viewportWidth="24"
              android:viewportHeight="18">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,3c4.2,0 8,1.6 10.9,4.3l-2.1,2.1C18.4,7.3 15.3,6 12,6c-3.3,0 -6.4,1.3 -8.8,3.4L1.1,7.3C4,4.6 7.8,3 12,3z M12,8.5c2.8,0 5.3,1.1 7.2,2.8l-2.1,2.1c-1.3,-1.2 -3.1,-1.9 -5.1,-1.9c-2,0 -3.8,0.7 -5.1,1.9L4.8,11.3C6.7,9.6 9.2,8.5 12,8.5z M12,14c1.1,0 2,0.9 2,2s-0.9,2 -2,2s-2,-0.9 -2,-2s0.9,-2 2,-2z"/>
          </vector>
          EOF

          # 7. Vector Icon Titik Sinyal GSM (ic_gsm_dots.xml)
          cat << 'EOF' > app/src/main/res/drawable/ic_gsm_dots.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="14dp"
              android:height="4dp"
              android:viewportWidth="24"
              android:viewportHeight="6">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M3,3m-2.5,0a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0 M9,3m-2.5,0a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0 M15,3m-2.5,0a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0 M21,3m-2.5,0a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0"/>
          </vector>
          EOF

          # 8. APK Launcher Icon (ic_launcher_bg & fg)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#121212" />
              <corners android:radius="22dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1F1F1F"
                  android:pathData="M54,20m-28,0a28,28 0 1,0 56,0a28,28 0 1,0 -56,0"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,42c6,0 11.4,2.3 15.5,6.1l-3,3C62.8,47.6 58.6,45.8 54,45.8c-4.6,0 -8.8,1.8 -12.5,5.3l-3,-3C42.6,44.3 48,42 54,42z M54,58c1.5,0 2.8,1.3 2.8,2.8c0,1.5 -1.3,2.8 -2.8,2.8c-1.5,0 -2.8,-1.3 -2.8,-2.8c0,-1.5 1.3,-2.8 2.8,-2.8z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M42,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M50,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M58,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0 M66,72m-2,0a2,2 0 1,0 4,0a2,2 0 1,0 -4,0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_bg" />
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          EOF

          # 9. Status Bar Overlay Layout (layout_stacked_status.xml)
          cat << 'EOF' > app/src/main/res/layout/layout_stacked_status.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="34dp"
              android:layout_height="38dp"
              android:background="@drawable/bg_status_circle"
              android:gravity="center"
              android:orientation="vertical"
              android:paddingHorizontal="2dp"
              android:paddingVertical="3dp">

              <!-- Text Persentase Baterai (Top) -->
              <TextView
                  android:id="@+id/tvBatteryPct"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:includeFontPadding="false"
                  android:text="83"
                  android:textColor="#FFFFFF"
                  android:textSize="9sp"
                  android:textStyle="bold" />

              <!-- Icon Wi-Fi (Center) -->
              <ImageView
                  android:id="@+id/imgWifi"
                  android:layout_width="12dp"
                  android:layout_height="9dp"
                  android:layout_marginTop="1dp"
                  android:src="@drawable/ic_wifi_small" />

              <!-- Titik Sinyal GSM (Bottom) -->
              <ImageView
                  android:id="@+id/imgGsmDots"
                  android:layout_width="12dp"
                  android:layout_height="3dp"
                  android:layout_marginTop="1dp"
                  android:src="@drawable/ic_gsm_dots" />

          </LinearLayout>
          EOF

          # 10. Activity Main Layout (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="iOS Duo Status Bar"
                      android:textColor="#000000"
                      android:textSize="22sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Status: Nonaktif"
                      android:textColor="#777777"
                      android:textSize="14sp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:orientation="horizontal">

                      <Button
                          android:id="@+id/btnStart"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginEnd="8dp"
                          android:layout_weight="1"
                          android:backgroundTint="#4CAF50"
                          android:text="▶ START" />

                      <Button
                          android:id="@+id/btnStop"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="8dp"
                          android:layout_weight="1"
                          android:backgroundTint="#F44336"
                          android:text="⏹ STOP" />
                  </LinearLayout>

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginVertical="24dp"
                      android:background="#DDDDDD" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⚙ Config Overlay Status Bar"
                      android:textColor="#000000"
                      android:textSize="18sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/tvLabelX"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="Posisi X Offset: 15 dp" />

                  <SeekBar
                      android:id="@+id/seekX"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="15" />

                  <TextView
                      android:id="@+id/tvLabelY"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Posisi Y Offset: 0 dp" />

                  <SeekBar
                      android:id="@+id/seekY"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="0" />

                  <TextView
                      android:id="@+id/tvLabelAlpha"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Opasitas / Transparansi: 100%" />

                  <SeekBar
                      android:id="@+id/seekAlpha"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="100" />

                  <Button
                      android:id="@+id/btnApply"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:backgroundTint="#2196F3"
                      android:text="💾 SIMPAN &amp; TERAPKAN CONFIG" />

              </LinearLayout>
          </ScrollView>
          EOF

          # 11. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="iOS Duo Status Bar"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".StatusBarOverlayService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 12. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/MainActivity.kt
          package com.example.iosstatusbar

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var tvStatus: TextView
              private lateinit var seekX: SeekBar
              private lateinit var seekY: SeekBar
              private lateinit var seekAlpha: SeekBar
              private lateinit var tvLabelX: TextView
              private lateinit var tvLabelY: TextView
              private lateinit var tvLabelAlpha: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvStatus = findViewById(R.id.tvStatus)
                  seekX = findViewById(R.id.seekX)
                  seekY = findViewById(R.id.seekY)
                  seekAlpha = findViewById(R.id.seekAlpha)
                  tvLabelX = findViewById(R.id.tvLabelX)
                  tvLabelY = findViewById(R.id.tvLabelY)
                  tvLabelAlpha = findViewById(R.id.tvLabelAlpha)

                  val btnStart = findViewById<Button>(R.id.btnStart)
                  val btnStop = findViewById<Button>(R.id.btnStop)
                  val btnApply = findViewById<Button>(R.id.btnApply)

                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  val posX = prefs.getInt("pos_x", 15)
                  val posY = prefs.getInt("pos_y", 0)
                  val alphaVal = prefs.getInt("alpha", 100)

                  seekX.progress = posX
                  seekY.progress = posY
                  seekAlpha.progress = alphaVal

                  updateLabels(posX, posY, alphaVal)

                  seekX.setOnSeekBarChangeListener(createSeekListener())
                  seekY.setOnSeekBarChangeListener(createSeekListener())
                  seekAlpha.setOnSeekBarChangeListener(createSeekListener())

                  btnStart.setOnClickListener { checkOverlayAndStart() }
                  btnStop.setOnClickListener { stopStatusService() }
                  btnApply.setOnClickListener { saveAndApplyConfig() }
              }

              private fun createSeekListener() = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                      updateLabels(seekX.progress, seekY.progress, seekAlpha.progress)
                  }
                  override fun onStartTrackingTouch(sb: SeekBar?) {}
                  override fun onStopTrackingTouch(sb: SeekBar?) {}
              }

              private fun updateLabels(x: Int, y: Int, alpha: Int) {
                  tvLabelX.text = "Posisi X Offset: $x dp"
                  tvLabelY.text = "Posisi Y Offset: $y dp"
                  tvLabelAlpha.text = "Opasitas / Transparansi: $alpha%"
              }

              private fun checkOverlayAndStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, 1234)
                  } else {
                      startStatusService()
                  }
              }

              private fun startStatusService() {
                  saveConfig()
                  val intent = Intent(this, StatusBarOverlayService::class.java)
                  startService(intent)
                  tvStatus.text = "Status: Aktif"
                  Toast.makeText(this, "Status bar iOS Duo diaktifkan!", Toast.LENGTH_SHORT).show()
              }

              private fun stopStatusService() {
                  val intent = Intent(this, StatusBarOverlayService::class.java)
                  stopService(intent)
                  tvStatus.text = "Status: Nonaktif"
                  Toast.makeText(this, "Status bar iOS Duo dihentikan!", Toast.LENGTH_SHORT).show()
              }

              private fun saveConfig() {
                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  prefs.edit()
                      .putInt("pos_x", seekX.progress)
                      .putInt("pos_y", seekY.progress)
                      .putInt("alpha", seekAlpha.progress)
                      .apply()
              }

              private fun saveAndApplyConfig() {
                  saveConfig()
                  val intent = Intent(this, StatusBarOverlayService::class.java).apply {
                      action = StatusBarOverlayService.ACTION_UPDATE
                  }
                  startService(intent)
                  Toast.makeText(this, "Config berhasil disimpan dan diterapkan!", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 13. StatusBarOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/StatusBarOverlayService.kt
          package com.example.iosstatusbar

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView

          class StatusBarOverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: View
              private lateinit var monitor: SystemStatusMonitor
              private var params: WindowManager.LayoutParams? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  overlayView = LayoutInflater.from(this).inflate(R.layout.layout_stacked_status, null)

                  val layoutParamsType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutParamsType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                  }

                  applyPreferences()
                  windowManager.addView(overlayView, params)

                  monitor = SystemStatusMonitor(this) { pct, _ ->
                      val tvBatteryPct = overlayView.findViewById<TextView>(R.id.tvBatteryPct)
                      tvBatteryPct.text = "$pct"
                  }
                  monitor.start()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_UPDATE) {
                      applyPreferences()
                      params?.let { windowManager.updateViewLayout(overlayView, it) }
                  }
                  return START_STICKY
              }

              private fun applyPreferences() {
                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  val posX = prefs.getInt("pos_x", 15)
                  val posY = prefs.getInt("pos_y", 0)
                  val alphaVal = prefs.getInt("alpha", 100)

                  params?.x = posX
                  params?.y = posY
                  overlayView.alpha = alphaVal / 100f
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::overlayView.isInitialized) {
                      try { windowManager.removeView(overlayView) } catch (_: Exception) {}
                  }
                  if (::monitor.isInitialized) monitor.stop()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  const val ACTION_UPDATE = "com.example.iosstatusbar.UPDATE_CONFIG"
              }
          }
          EOF

          # 14. SystemStatusMonitor.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/SystemStatusMonitor.kt
          package com.example.iosstatusbar

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager

          class SystemStatusMonitor(
              private val context: Context,
              private val onStatusChanged: (batteryPct: Int, isCharging: Boolean) -> Unit
          ) {
              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(ctx: Context?, intent: Intent?) {
                      intent?.let {
                          val level = it.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                          val scale = it.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                          val status = it.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
                          val isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                  status == BatteryManager.BATTERY_STATUS_FULL
                          val batteryPct = if (level != -1 && scale != -1) {
                              (level * 100 / scale.toFloat()).toInt()
                          } else 0
                          onStatusChanged(batteryPct, isCharging)
                      }
                  }
              }

              fun start() {
                  val filter = IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  context.registerReceiver(batteryReceiver, filter)
              }

              fun stop() {
                  try {
                      context.unregisterReceiver(batteryReceiver)
                  } catch (_: Exception) {}
              }
          }
          EOF

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Make Gradlew Executable & Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Artifact and Environment Variables
        run: |
          export TZ='Asia/Jakarta'
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S WIB')
          FILE_DATE=$(date +'%Y%m%d_%H%M%S')
          APK_NAME="iOS_Duo_Status_Bar_${FILE_DATE}.apk"

          mkdir -p release_output
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_output/${APK_NAME}
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk release_output/${APK_NAME}
          else
            cp app/build/outputs/apk/debug/app-debug.apk release_output/${APK_NAME}
          fi

          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV

      - name: Update README.md
        run: |
          cat << EOF > README.md
          # 📱 iOS Duo Status Bar for Android

          [![Build Status](https://github.com/${{ github.repository }}/actions/workflows/main.yml/badge.svg)](https://github.com/${{ github.repository }}/actions)
          [![Platform](https://img.shields.io/badge/Platform-Android-green.svg)](https://developer.android.com)
          [![API Level](https://img.shields.io/badge/API-24%2B-blue.svg)](https://android-arsenal.com/api?level=24)
          [![License](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)

          **iOS Duo Status Bar** adalah aplikasi Android berbasis *System Alert Window (Overlay)* yang dirancang untuk menghadirkan tampilan status bar terpadu bergaya iOS Duo secara presisi dan elegan di sudut atas layar Android Anda.

          Proyek ini dibuat secara terstruktur, bersih, dan modular menggunakan Kotlin serta Android Jetpack komponen dasar, sehingga sangat terbuka untuk dikembangkan bersama oleh komunitas (*open-source collaborative project*).

          ---

