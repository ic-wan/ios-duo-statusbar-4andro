name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Source Code
        run: |
          # 1. Buat direktori folder project
          mkdir -p app/src/main/java/com/example/iosstatusbar
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iOS Duo Status Bar"
          include ':app'
          EOF

          # 3. build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 4. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 5. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.iosstatusbar'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.iosstatusbar"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 6. Background Bulatan Hitam Transparan (bg_circle_black.xml)
          cat << 'EOF' > app/src/main/res/drawable/bg_circle_black.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#88000000" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
          </shape>
          EOF

          # 7. Vector Icon Baterai Bulat (ic_ios_battery_circle.xml)
          cat << 'EOF' > app/src/main/res/drawable/ic_ios_battery_circle.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="16dp"
              android:height="16dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M15.67,4H14V2h-4v2H8.33C7.6,4 7,4.6 7,5.33v15.33C7,21.4 7.6,22 8.33,22h7.33c0.74,0 1.34,-0.6 1.34,-1.33V5.33C17,4.6 16.4,4 15.67,4z M15,18H9V8h6V18z"/>
          </vector>
          EOF

          # 8. Vector Icon Sinyal GSM + Wi-Fi Terintegrasi (ic_ios_signal_wifi.xml)
          cat << 'EOF' > app/src/main/res/drawable/ic_ios_signal_wifi.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="16dp"
              android:height="16dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <!-- Sinyal GSM Outer Ring/Bars -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M2,22h3v-5H2V22z M7,22h3v-9H7V22z M12,22h3v-13h-3V22z M17,22h3V5h-3V22z"/>
              <!-- Icon Wi-Fi Kecil di Dalam -->
              <path
                  android:fillColor="#00E676"
                  android:pathData="M12,10c-2.2,0 -4.2,0.9 -5.7,2.3l1.4,1.4c1.1,-1 2.6,-1.7 4.3,-1.7c1.7,0 3.2,0.7 4.3,1.7l1.4,-1.4C16.2,10.9 14.2,10 12,10z M12,14c-1.1,0 -2.1,0.5 -2.8,1.2l2.8,2.8l2.8,-2.8C14.1,14.5 13.1,14 12,14z"/>
          </vector>
          EOF

          # 9. Design Visual APK Launcher Icon Background & Foreground
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#121212" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Bulatan Atas (Baterai) -->
              <path
                  android:fillColor="#333333"
                  android:pathData="M54,24m-14,0a14,14 0 1,0 28,0a14,14 0 1,0 -28,0"/>
              <path
                  android:fillColor="#00E676"
                  android:pathData="M51,18h6v12h-6z M48,22h12v4h-12z"/>

              <!-- Bulatan Bawah (GSM & Wi-Fi) -->
              <path
                  android:fillColor="#333333"
                  android:pathData="M54,58m-16,0a16,16 0 1,0 32,0a16,16 0 1,0 -32,0"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M44,64h3v-6h-3v6z M49,64h3v-10h-3v10z M54,64h3v-14h-3v14z M59,64h3v-18h-3v18z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@drawable/ic_launcher_bg" />
              <item android:drawable="@drawable/ic_launcher_fg" />
          </layer-list>
          EOF

          # 10. Layout Status Bar Duo Bulat (layout_stacked_status.xml)
          cat << 'EOF' > app/src/main/res/layout/layout_stacked_status.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:gravity="center"
              android:orientation="vertical">

              <!-- Bulatan Atas: Baterai Bulat -->
              <FrameLayout
                  android:layout_width="22dp"
                  android:layout_height="22dp"
                  android:background="@drawable/bg_circle_black">

                  <ImageView
                      android:id="@+id/imgBattery"
                      android:layout_width="13dp"
                      android:layout_height="13dp"
                      android:layout_gravity="center"
                      android:src="@drawable/ic_ios_battery_circle" />
              </FrameLayout>

              <!-- Bulatan Bawah: Sinyal GSM + Wi-Fi di Dalamnya -->
              <FrameLayout
                  android:layout_width="22dp"
                  android:layout_height="22dp"
                  android:layout_marginTop="3dp"
                  android:background="@drawable/bg_circle_black">

                  <ImageView
                      android:id="@+id/imgSignalWifi"
                      android:layout_width="14dp"
                      android:layout_height="14dp"
                      android:layout_gravity="center"
                      android:src="@drawable/ic_ios_signal_wifi" />
              </FrameLayout>

          </LinearLayout>
          EOF

          # 11. Activity Main Layout (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="20dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="iOS Duo Status Bar"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:textColor="#000000" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Status: Nonaktif"
                      android:textSize="14sp"
                      android:textColor="#777777" />

                  <!-- Control Buttons: Start & Stop -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:orientation="horizontal">

                      <Button
                          android:id="@+id/btnStart"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginEnd="8dp"
                          android:text="▶ START"
                          android:backgroundTint="#4CAF50" />

                      <Button
                          android:id="@+id/btnStop"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:layout_marginStart="8dp"
                          android:text="⏹ STOP"
                          android:backgroundTint="#F44336" />
                  </LinearLayout>

                  <!-- Config Section -->
                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginVertical="24dp"
                      android:background="#DDDDDD" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="⚙ Config Overlay Status Bar"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:textColor="#000000" />

                  <!-- Config X -->
                  <TextView
                      android:id="@+id/tvLabelX"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="Posisi X Offset: 16 dp" />

                  <SeekBar
                      android:id="@+id/seekX"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="16" />

                  <!-- Config Y -->
                  <TextView
                      android:id="@+id/tvLabelY"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Posisi Y Offset: 0 dp" />

                  <SeekBar
                      android:id="@+id/seekY"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="0" />

                  <!-- Config Alpha / Transparency -->
                  <TextView
                      android:id="@+id/tvLabelAlpha"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Opasitas / Transparansi: 100%" />

                  <SeekBar
                      android:id="@+id/seekAlpha"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="100" />

                  <Button
                      android:id="@+id/btnApply"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="💾 SIMPAN &amp; TERAPKAN CONFIG"
                      android:backgroundTint="#2196F3" />

              </LinearLayout>
          </ScrollView>
          EOF

          # 12. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="iOS Duo Status Bar"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".StatusBarOverlayService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 13. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/MainActivity.kt
          package com.example.iosstatusbar

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var tvStatus: TextView
              private lateinit var seekX: SeekBar
              private lateinit var seekY: SeekBar
              private lateinit var seekAlpha: SeekBar
              private lateinit var tvLabelX: TextView
              private lateinit var tvLabelY: TextView
              private lateinit var tvLabelAlpha: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  tvStatus = findViewById(R.id.tvStatus)
                  seekX = findViewById(R.id.seekX)
                  seekY = findViewById(R.id.seekY)
                  seekAlpha = findViewById(R.id.seekAlpha)
                  tvLabelX = findViewById(R.id.tvLabelX)
                  tvLabelY = findViewById(R.id.tvLabelY)
                  tvLabelAlpha = findViewById(R.id.tvLabelAlpha)

                  val btnStart = findViewById<Button>(R.id.btnStart)
                  val btnStop = findViewById<Button>(R.id.btnStop)
                  val btnApply = findViewById<Button>(R.id.btnApply)

                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  val posX = prefs.getInt("pos_x", 16)
                  val posY = prefs.getInt("pos_y", 0)
                  val alphaVal = prefs.getInt("alpha", 100)

                  seekX.progress = posX
                  seekY.progress = posY
                  seekAlpha.progress = alphaVal

                  updateLabels(posX, posY, alphaVal)

                  seekX.setOnSeekBarChangeListener(createSeekListener())
                  seekY.setOnSeekBarChangeListener(createSeekListener())
                  seekAlpha.setOnSeekBarChangeListener(createSeekListener())

                  btnStart.setOnClickListener { checkOverlayAndStart() }
                  btnStop.setOnClickListener { stopStatusService() }
                  btnApply.setOnClickListener { saveAndApplyConfig() }
              }

              private fun createSeekListener() = object : SeekBar.OnSeekBarChangeListener {
                  override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                      updateLabels(seekX.progress, seekY.progress, seekAlpha.progress)
                  }
                  override fun onStartTrackingTouch(sb: SeekBar?) {}
                  override fun onStopTrackingTouch(sb: SeekBar?) {}
              }

              private fun updateLabels(x: Int, y: Int, alpha: Int) {
                  tvLabelX.text = "Posisi X Offset: $x dp"
                  tvLabelY.text = "Posisi Y Offset: $y dp"
                  tvLabelAlpha.text = "Opasitas / Transparansi: $alpha%"
              }

              private fun checkOverlayAndStart() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, 1234)
                  } else {
                      startStatusService()
                  }
              }

              private fun startStatusService() {
                  saveConfig()
                  val intent = Intent(this, StatusBarOverlayService::class.java)
                  startService(intent)
                  tvStatus.text = "Status: Aktif"
                  Toast.makeText(this, "Status bar iOS Duo diaktifkan!", Toast.LENGTH_SHORT).show()
              }

              private fun stopStatusService() {
                  val intent = Intent(this, StatusBarOverlayService::class.java)
                  stopService(intent)
                  tvStatus.text = "Status: Nonaktif"
                  Toast.makeText(this, "Status bar iOS Duo dihentikan!", Toast.LENGTH_SHORT).show()
              }

              private fun saveConfig() {
                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  prefs.edit()
                      .putInt("pos_x", seekX.progress)
                      .putInt("pos_y", seekY.progress)
                      .putInt("alpha", seekAlpha.progress)
                      .apply()
              }

              private fun saveAndApplyConfig() {
                  saveConfig()
                  val intent = Intent(this, StatusBarOverlayService::class.java).apply {
                      action = StatusBarOverlayService.ACTION_UPDATE
                  }
                  startService(intent)
                  Toast.makeText(this, "Config berhasil disimpan dan diterapkan!", Toast.LENGTH_SHORT).show()
              }
          }
          EOF

          # 14. StatusBarOverlayService.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/StatusBarOverlayService.kt
          package com.example.iosstatusbar

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.LayoutInflater
          import android.view.View
          import android.view.WindowManager
          import android.widget.ImageView

          class StatusBarOverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: View
              private lateinit var monitor: SystemStatusMonitor
              private var params: WindowManager.LayoutParams? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  overlayView = LayoutInflater.from(this).inflate(R.layout.layout_stacked_status, null)

                  val layoutParamsType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutParamsType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                  }

                  applyPreferences()
                  windowManager.addView(overlayView, params)

                  monitor = SystemStatusMonitor(this) { pct, isCharging ->
                      val imgBattery = overlayView.findViewById<ImageView>(R.id.imgBattery)
                      imgBattery.alpha = if (isCharging) 1.0f else 0.85f
                  }
                  monitor.start()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_UPDATE) {
                      applyPreferences()
                      params?.let { windowManager.updateViewLayout(overlayView, it) }
                  }
                  return START_STICKY
              }

              private fun applyPreferences() {
                  val prefs = getSharedPreferences("ios_prefs", Context.MODE_PRIVATE)
                  val posX = prefs.getInt("pos_x", 16)
                  val posY = prefs.getInt("pos_y", 0)
                  val alphaVal = prefs.getInt("alpha", 100)

                  params?.x = posX
                  params?.y = posY
                  overlayView.alpha = alphaVal / 100f
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::overlayView.isInitialized) {
                      try { windowManager.removeView(overlayView) } catch (_: Exception) {}
                  }
                  if (::monitor.isInitialized) monitor.stop()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              companion object {
                  const val ACTION_UPDATE = "com.example.iosstatusbar.UPDATE_CONFIG"
              }
          }
          EOF

          # 15. SystemStatusMonitor.kt
          cat << 'EOF' > app/src/main/java/com/example/iosstatusbar/SystemStatusMonitor.kt
          package com.example.iosstatusbar

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager

          class SystemStatusMonitor(
              private val context: Context,
              private val onStatusChanged: (batteryPct: Int, isCharging: Boolean) -> Unit
          ) {
              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(ctx: Context?, intent: Intent?) {
                      intent?.let {
                          val level = it.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                          val scale = it.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                          val status = it.getIntExtra(BatteryManager.EXTRA_STATUS, -1)

                          val pct = if (level != -1 && scale != -1) (level * 100 / scale.toFloat()).toInt() else 0
                          val charging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                         status == BatteryManager.BATTERY_STATUS_FULL

                          onStatusChanged(pct, charging)
                      }
                  }
              }

              fun start() {
                  val filter = IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  context.registerReceiver(batteryReceiver, filter)
              }

              fun stop() {
                  try {
                      context.unregisterReceiver(batteryReceiver)
                  } catch (_: Exception) {}
              }
          }
          EOF

      - name: Generate Gradle Wrapper 8.5
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug

      - name: Get Date and Time String (YYYY-MM-DD_HH-MM)
        id: timestamp
        run: echo "TIMESTAMP=$(date +%Y-%m-%d_%H-%M)" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Duo-StatusBar-${{ env.TIMESTAMP }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Update Cumulative README.md & Changelog
        if: success()
        env:
          FILE_VER: "iOS-Duo-StatusBar-${{ env.TIMESTAMP }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          python3 -c "
          import os

          file_ver = os.environ['FILE_VER']
          run_url = os.environ['RUN_URL']
          build_time = os.popen('date +\"%Y-%m-%d %H:%M:%S UTC\"').read().strip()
          commit_msg = os.popen('git log -1 --pretty=format:\"%s\"').read().strip().replace('|', '-')

          new_row = f'| **[{file_ver}]({run_url})** | `{build_time}` | {commit_msg} | ✅ Berhasil |'

          readme_path = 'README.md'
          base_readme = f'''# iOS Duo Status Bar for Android 📱

          Aplikasi Android untuk menampilkan modul overlay status bar gaya **iOS Duo**, di mana **Baterai** berada pada bulatan atas, serta **Sinyal GSM** dan **Wi-Fi** berada di bulatan bawah secara terintegrasi.

          ---

          ## 🌟 Fitur Utama
          - **Dual-Circle iOS Duo**: Bulatan atas untuk indikator baterai, bulatan bawah untuk sinyal GSM dan Wi-Fi terintegrasi.
          - **Custom APK Icon**: Ikon launcher aplikasi disesuaikan dengan bentuk visual overlay.
          - **Tombol START & STOP**: Mengontrol pengaktifan service overlay secara langsung.
          - **Panel Config Live**: Pengaturan posisi offset X, Y, dan opasitas/transparansi.
          - **Direct Status Bar Placement**: Menempel rapi di area paling atas tanpa memerlukan akses Root.

          ---

          ## 📦 Unduh APK & Artifacts Terbaru

