              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M39,76m-3,0a3,3 0 1,0 6,0a3,3 0 1,0 -6,0 M49,76m-3,0a3,3 0 1,0 6,0a3,3 0 1,0 -6,0 M59,76m-3,0a3,3 0 1,0 6,0a3,3 0 1,0 -6,0 M69,76m-3,0a3,3 0 1,0 6,0a3,3 0 1,0 -6,0"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
